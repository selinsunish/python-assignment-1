<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Design Upload</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: #ffffff; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background-color: #1e1e1e; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.5); width: 100%; max-width: 400px; text-align: center; }
        input[type="file"] { margin: 20px 0; background: #333; padding: 10px; border-radius: 5px; width: 90%; color: white;}
        button { background-color: #bb86fc; color: #000; padding: 10px 20px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 16px; width: 100%; }
        button:hover { background-color: #9965f4; }
        #result { margin-top: 20px; display: none; }
        #result img { width: 100%; border-radius: 8px; margin-top: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>Submit Your Design 🎨</h2>
        <form id="uploadForm">
            <input type="file" id="designImage" accept="image/*" required>
            <button type="submit">Upload & Process</button>
        </form>

        <div id="result">
            <h3 style="color: #66bb6a;">✅ Rendered Image</h3>
            <img id="renderedImg" src="" alt="Rendered Product">
        </div>
    </div>

    <script>
        document.getElementById("uploadForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const file = document.getElementById("designImage").files[0];
            const formData = new FormData();
            formData.append("design_image", file);

            const btn = document.querySelector("button");
            btn.innerText = "Processing...";

            try {
                // Upload design
                const res = await fetch("/api/upload-design/", {
                    method: "POST",
                    body: formData
                });
                const data = await res.json();
                
                if (data.design_id) {
                    // Fetch rendered image
                    const res2 = await fetch(`/api/rendered-images/${data.design_id}/`);
                    const imgData = await res2.json();
                    
                    if(imgData.rendered_images && imgData.rendered_images.length > 0) {
                        const imgUrl = imgData.rendered_images[0].rendered_url;
                        document.getElementById("renderedImg").src = imgUrl;
                        document.getElementById("result").style.display = "block";
                    } else {
                        alert("Image processed but no file returned. Check server logs!");
                    }
                } else {
                    alert("Error: " + (data.error || "Unknown"));
                }
            } catch (err) {
                alert("Something went wrong! Check console.");
            }
            btn.innerText = "Upload & Process";
        });
    </script>
</body>
</html>
